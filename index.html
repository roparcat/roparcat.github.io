<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoparCat Tournaments</title>
<meta name="description" content="Tabs and results from debate tournaments run by DebSoc IIT Ropar.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brown: #4B2102;
    --brown-soft: #7a3d12;
    --bg: #faf7f4;
    --card: #ffffff;
    --text: #22170f;
    --muted: #6f6258;
    --border: #e9e1d9;
    --accent-bg: #f4ebe2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17110c;
      --card: #211913;
      --text: #f3ece6;
      --muted: #b3a597;
      --border: #3a2d23;
      --accent-bg: #2d2119;
      --brown-soft: #d79a62;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  header {
    background: var(--brown);
    color: #fff;
    padding: 56px 0 72px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img {
    width: 64px; height: 64px;
    background: #fff; border-radius: 14px; padding: 6px;
  }
  .brand h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; opacity: 0.8; }

  main { margin-top: -40px; padding-bottom: 48px; }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin: 32px 0 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(75, 33, 2, 0.08);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card h3 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
  .meta { color: var(--muted); margin: 4px 0 0; }
  .badge {
    background: var(--accent-bg); color: var(--brown-soft);
    font-size: 0.8rem; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .champion {
    margin: 20px 0;
    padding: 14px 16px;
    background: var(--accent-bg);
    border-radius: 12px;
  }
  .champion small { display: block; color: var(--muted); font-size: 0.8rem; }
  .champion strong { font-size: 1.05rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 600;
    padding: 12px 20px; border-radius: 10px;
    border: 2px solid var(--brown);
  }
  .btn-primary { background: var(--brown); color: #fff; }
  .btn-primary:hover { background: #5e2a04; }
  .btn-ghost { color: var(--brown-soft); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--brown-soft); }
  .btn:focus-visible { outline: 3px solid var(--brown-soft); outline-offset: 2px; }

  footer { color: var(--muted); font-size: 0.85rem; padding: 24px 0 40px; border-top: 1px solid var(--border); }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <div class="wrap brand">
      <img src="logo.png" alt="DebSoc IIT Ropar logo">
      <div>
        <h1>RoparCat</h1>
        <p>Debate tournaments by DebSoc IIT Ropar</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h2>Available tournaments</h2>

    <article class="card">
      <div class="card-top">
        <div>
          <h3>Eristic 26</h3>
          <p class="meta">IIT Ropar · October 2026</p>
        </div>
        <span class="badge">Completed</span>
      </div>

      <div class="champion">
        <small>🏆 Champions</small>
        <strong>Mard jaat haaye haaye</strong>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="eristic26-tab/team/">View Eristic 26 tab →</a>
        <a class="btn btn-ghost" href="eristic26-tab/speaker/">Speaker tab</a>
      </div>
    </article>
  </main>

  <footer class="wrap">
    Tabs run on RoparCat, based on <a href="https://github.com/TabbycatDebate/tabbycat">Tabbycat</a> by the Tabbycat Debate Association.
  </footer>
</body>
</html>
